<!DOCTYPE html>
<!--
  index.html —— App 唯一页面入口(单页)。
  背新词 / 复习·陌生 / 复习·不会 三种场景共用一个容器 #app,由 js/app.js 按场景切换渲染。
  以后要加新功能:优先新增独立 js(如 js/browse.js)并在下方按依赖顺序引入,再在 app.js 里注册入口。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4f6ef7">
  <title>六级背单词</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 唯一渲染容器:首页 / 单词卡片 / 空队列鼓励,都由 app.js 画进这里 -->
  <div id="app" class="app"></div>

  <!-- 引入顺序 = 依赖顺序:数据层 → 状态层 → 界面层 -->
  <script src="js/words.js"></script>
  <script src="js/state.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
