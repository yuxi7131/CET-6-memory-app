# 一次性任务:用 KEYSTORE_PASS 生成固定签名钥匙,并作为 artifact 交回。
# 用完后会删掉本文件(生成结果已存入 secret KEYSTORE_B64)。
name: Generate signing keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate release.keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -storepass "${{ secrets.KEYSTORE_PASS }}" \
            -alias "cet6" -keypass "${{ secrets.KEYSTORE_PASS }}" \
            -dname "CN=CET6 Memory App, O=personal, C=CN" \
            -keyalg RSA -keysize 2048 -validity 10000
      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: release.keystore
